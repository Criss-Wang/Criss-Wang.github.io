<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">LLM Validator scorecard</title>
  <desc id="desc">A clean validation scorecard showing configs flowing into model metrics.</desc>
  <defs>
    <style>
      .bg{fill:#faf7f0}.ink{fill:#25313a;font:800 58px ui-monospace,SFMono-Regular,Menlo,monospace}.label{fill:#25313a;font:800 34px ui-monospace,SFMono-Regular,Menlo,monospace}.small{fill:#6f746f;font:700 25px ui-monospace,SFMono-Regular,Menlo,monospace}.card{fill:#fffefa;stroke:#cfc6ba;stroke-width:3}.metric{fill:#eef1ee;stroke:#c9c8c0;stroke-width:3}.line{fill:none;stroke:#405866;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.blue{fill:#4f7f95}.orange{fill:#b46d3a}.green{fill:#657d57}.barBg{fill:#ddd8cf}.barA{fill:#4f7f95}.barB{fill:#b46d3a}.barC{fill:#657d57}
    </style>
  </defs>
  <rect class="bg" width="1200" height="675"/>
  <text class="ink" x="70" y="100">LLM Validator</text>
  <text class="small" x="74" y="140">configurable model checks</text>

  <g transform="translate(90 210)">
    <rect class="card" x="0" y="0" width="250" height="78" rx="16"/>
    <text class="label" x="36" y="51">config</text>
    <rect class="card" x="0" y="118" width="250" height="78" rx="16"/>
    <text class="label" x="36" y="169">prompt</text>
    <rect class="card" x="0" y="236" width="250" height="78" rx="16"/>
    <text class="label" x="36" y="287">dataset</text>
  </g>

  <path class="line" d="M360 250H505M360 368H505M360 486H505"/>
  <circle class="blue" cx="505" cy="250" r="12"/><circle class="orange" cx="505" cy="368" r="12"/><circle class="green" cx="505" cy="486" r="12"/>

  <rect class="card" x="545" y="186" width="230" height="344" rx="22"/>
  <text class="label" x="586" y="248">run</text>
  <text class="small" x="586" y="295">OpenAI</text>
  <text class="small" x="586" y="335">Anthropic</text>
  <text class="small" x="586" y="375">local</text>
  <text class="small" x="586" y="455">parallel</text>
  <text class="small" x="586" y="492">tracked</text>

  <path class="line" d="M775 358H850"/>

  <g transform="translate(870 180)">
    <rect class="metric" x="0" y="0" width="250" height="88" rx="16"/>
    <text class="small" x="30" y="36">accuracy</text>
    <rect class="barBg" x="30" y="54" width="170" height="16" rx="8"/><rect class="barA" x="30" y="54" width="134" height="16" rx="8"/>
    <rect class="metric" x="0" y="128" width="250" height="88" rx="16"/>
    <text class="small" x="30" y="164">latency</text>
    <rect class="barBg" x="30" y="182" width="170" height="16" rx="8"/><rect class="barB" x="30" y="182" width="88" height="16" rx="8"/>
    <rect class="metric" x="0" y="256" width="250" height="88" rx="16"/>
    <text class="small" x="30" y="292">cost</text>
    <rect class="barBg" x="30" y="310" width="170" height="16" rx="8"/><rect class="barC" x="30" y="310" width="70" height="16" rx="8"/>
  </g>
</svg>
