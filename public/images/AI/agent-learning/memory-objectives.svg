<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Task completion and memory quality are different objectives</title>
  <desc id="desc">A two-column comparison showing that task completion rewards immediate success while memory quality rewards durable, scoped, and correct future usefulness.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .task { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 16; }
      .memory { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 16; }
      .warning { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 16; }
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #475569; }
      .h { font-size: 24px; font-weight: 800; }
      .body { font-size: 17px; fill: #334155; }
      .small { font-size: 14px; fill: #64748b; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="650"/>
  <text class="text title" x="60" y="62">Memory is not task completion</text>
  <text class="text subtitle" x="60" y="94">The same run can succeed at the task while producing bad memory.</text>

  <rect class="card" x="70" y="130" width="1060" height="430"/>

  <rect class="task" x="115" y="175" width="430" height="295"/>
  <text class="text h" x="145" y="220">Task Completion Objective</text>
  <text class="text body" x="145" y="263">Rewards immediate progress:</text>
  <text class="text body" x="165" y="302">- pass tests</text>
  <text class="text body" x="165" y="334">- satisfy the request</text>
  <text class="text body" x="165" y="366">- reduce visible blockers</text>
  <text class="text body" x="165" y="398">- produce a plausible final answer</text>
  <text class="text small" x="145" y="442">Risk: memory becomes an unpriced side effect.</text>

  <rect class="memory" x="655" y="175" width="430" height="295"/>
  <text class="text h" x="685" y="220">Memory Quality Objective</text>
  <text class="text body" x="685" y="263">Rewards future usefulness:</text>
  <text class="text body" x="705" y="302">- accuracy and provenance</text>
  <text class="text body" x="705" y="334">- scope and staleness control</text>
  <text class="text body" x="705" y="366">- contradiction repair</text>
  <text class="text body" x="705" y="398">- retrieval value per token</text>
  <text class="text small" x="685" y="442">Goal: durable improvement without false confidence.</text>

  <path class="arrow" d="M 545 322 L 645 322"/>
  <text class="text small" x="568" y="300">not identical</text>

  <rect class="warning" x="255" y="510" width="690" height="78"/>
  <text class="text body" x="600" y="544" text-anchor="middle">A good agent needs separate evals for doing the work</text>
  <text class="text body" x="600" y="574" text-anchor="middle">and for deciding what should persist after the work.</text>
</svg>
