<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">The Ralph loop needs the world to keep score</title>
  <desc id="desc">A circular diagram showing a fixed objective, fresh agent run, workspace state, tests and progress ledger, and a stop or continue decision.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .node { fill: #ffffff; stroke: #334155; stroke-width: 2.5; rx: 16; }
      .state { fill: #ecfeff; stroke: #0891b2; stroke-width: 2.5; rx: 16; }
      .score { fill: #fefce8; stroke: #ca8a04; stroke-width: 2.5; rx: 16; }
      .stop { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2.5; rx: 16; }
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #475569; }
      .h { font-size: 22px; font-weight: 800; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 13px; fill: #64748b; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="680"/>
  <text class="text title" x="60" y="62">The Ralph loop works only when the world keeps score</text>
  <text class="text subtitle" x="60" y="94">Repeated fresh agent runs need durable external state, tests, and stop criteria.</text>

  <rect class="node" x="460" y="138" width="280" height="92"/>
  <text class="text h" x="600" y="174" text-anchor="middle">Fixed Objective</text>
  <text class="text body" x="600" y="202" text-anchor="middle">the prompt can stay stable</text>

  <rect class="node" x="795" y="282" width="270" height="108"/>
  <text class="text h" x="930" y="322" text-anchor="middle">Fresh Agent Run</text>
  <text class="text body" x="930" y="350" text-anchor="middle">read state, act, exit</text>
  <text class="text small" x="930" y="374" text-anchor="middle">context resets each iteration</text>

  <rect class="state" x="460" y="455" width="280" height="112"/>
  <text class="text h" x="600" y="496" text-anchor="middle">Workspace State</text>
  <text class="text body" x="600" y="524" text-anchor="middle">code, git, files, memory</text>
  <text class="text small" x="600" y="548" text-anchor="middle">the environment changes</text>

  <rect class="score" x="135" y="282" width="270" height="108"/>
  <text class="text h" x="270" y="322" text-anchor="middle">Scorekeeper</text>
  <text class="text body" x="270" y="350" text-anchor="middle">tests, progress ledger,</text>
  <text class="text body" x="270" y="374" text-anchor="middle">failed approaches</text>

  <rect class="stop" x="460" y="282" width="280" height="108"/>
  <text class="text h" x="600" y="322" text-anchor="middle">Stop / Continue</text>
  <text class="text body" x="600" y="350" text-anchor="middle">is there less work</text>
  <text class="text body" x="600" y="374" text-anchor="middle">than before?</text>

  <path class="arrow" d="M 740 184 C 828 204, 890 232, 918 272"/>
  <path class="arrow" d="M 930 390 C 888 452, 820 497, 750 510"/>
  <path class="arrow" d="M 460 511 C 366 492, 300 450, 276 400"/>
  <path class="arrow" d="M 270 282 C 318 222, 384 190, 450 184"/>
  <path class="arrow" d="M 405 336 L 450 336"/>
  <path class="arrow" d="M 740 336 L 785 336"/>

  <text class="text small" x="885" y="231">same objective, new state</text>
  <text class="text small" x="793" y="480">writes durable progress</text>
  <text class="text small" x="257" y="462">measures progress</text>
  <text class="text small" x="350" y="224">continue if not done</text>

  <text class="text body" x="600" y="632" text-anchor="middle">If the workspace cannot record progress or failure, the loop becomes repeated amnesia.</text>
</svg>
