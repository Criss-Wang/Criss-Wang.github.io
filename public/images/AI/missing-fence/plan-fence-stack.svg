<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">The missing fence between AI plans and PR stacks</title>
  <desc id="desc">A model-facing plan is converted into a human-reviewable fence before becoming a PR stack, preventing late rollback from PR2 back into PR1.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <marker id="riskArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .model { fill: #eef2ff; stroke: #4338ca; stroke-width: 2; rx: 14; }
      .fence { fill: #fff7ed; stroke: #c2410c; stroke-width: 2.5; rx: 16; }
      .stack { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 14; }
      .warn { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; rx: 12; }
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 18px; font-weight: 750; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .riskLine { stroke: #c2410c; stroke-width: 3; stroke-dasharray: 7 7; fill: none; marker-end: url(#riskArrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title" x="60" y="62">A plan is not a review surface</text>
  <text class="text subtitle" x="60" y="94">The missing step is a small human-reviewable fence before PR slicing begins.</text>

  <rect class="panel" x="52" y="128" width="1096" height="500"/>

  <rect class="model" x="92" y="192" width="230" height="260"/>
  <text class="text label" x="207" y="232" text-anchor="middle">Model-Facing Plan</text>
  <text class="text small" x="207" y="270" text-anchor="middle">optimized for continuation</text>
  <text class="text small" x="207" y="306" text-anchor="middle">files, steps, TODOs</text>
  <text class="text small" x="207" y="330" text-anchor="middle">branches, assumptions</text>
  <text class="text small" x="207" y="354" text-anchor="middle">enough context to keep moving</text>
  <text class="text tiny" x="207" y="412" text-anchor="middle">useful for the agent</text>

  <rect class="fence" x="425" y="172" width="300" height="300"/>
  <text class="text label" x="575" y="214" text-anchor="middle">Review Fence</text>
  <text class="text small" x="575" y="250" text-anchor="middle">optimized for judgment</text>
  <text class="text small" x="575" y="292" text-anchor="middle">data model</text>
  <text class="text small" x="575" y="320" text-anchor="middle">ownership boundary</text>
  <text class="text small" x="575" y="348" text-anchor="middle">local conventions</text>
  <text class="text small" x="575" y="376" text-anchor="middle">PR dependencies</text>
  <text class="text small" x="575" y="404" text-anchor="middle">rejection criteria</text>
  <text class="text tiny" x="575" y="440" text-anchor="middle">cheap place to say no</text>

  <path class="arrow" d="M 322 322 L 414 322"/>
  <text class="text tiny" x="350" y="302">convert</text>

  <g>
    <rect class="stack" x="830" y="178" width="112" height="68"/>
    <text class="text label" x="886" y="220" text-anchor="middle">PR1</text>
    <text class="text tiny" x="886" y="236" text-anchor="middle">foundation</text>
    <rect class="stack" x="830" y="276" width="112" height="68"/>
    <text class="text label" x="886" y="318" text-anchor="middle">PR2</text>
    <text class="text tiny" x="886" y="334" text-anchor="middle">core logic</text>
    <rect class="stack" x="830" y="374" width="112" height="68"/>
    <text class="text label" x="886" y="416" text-anchor="middle">PR3</text>
    <text class="text tiny" x="886" y="432" text-anchor="middle">UI / polish</text>

    <rect class="warn" x="986" y="276" width="98" height="68"/>
    <text class="text label" x="1035" y="304" text-anchor="middle">Oops</text>
    <text class="text tiny" x="1035" y="326" text-anchor="middle">wrong</text>
    <text class="text tiny" x="1035" y="342" text-anchor="middle">abstraction</text>
  </g>

  <path class="arrow" d="M 725 322 L 820 322"/>
  <text class="text tiny" x="750" y="302">slice after review</text>

  <path class="riskLine" d="M 986 310 C 960 260, 952 218, 944 210"/>
  <text class="text tiny" x="965" y="246" fill="#c2410c">PR2 → PR1 rollback</text>

  <text class="text tiny" x="60" y="666">Key idea: make the expensive decision visible before implementation turns it into stack debt.</text>
</svg>
