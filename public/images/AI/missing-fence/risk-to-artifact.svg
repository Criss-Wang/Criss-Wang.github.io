<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Match the review fence to the riskiest decision</title>
  <desc id="desc">A diagram mapping schema, ownership, UI, and integration risks to the smallest review artifact that makes each decision visible.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; }
      .risk { fill: #fff7ed; stroke: #c2410c; stroke-width: 2; rx: 14; }
      .artifact { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 14; }
      .center { fill: #eef2ff; stroke: #4338ca; stroke-width: 2.5; rx: 16; }
      .text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; fill: #475569; }
      .label { font-size: 18px; font-weight: 750; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 12px; fill: #64748b; }
      .arrow { stroke: #1f2937; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="700"/>
  <text class="text title" x="60" y="62">The fence should match the risk</text>
  <text class="text subtitle" x="60" y="94">Do not default to a design doc. Choose the smallest artifact that exposes the expensive decision.</text>

  <rect class="panel" x="52" y="128" width="1096" height="500"/>

  <rect class="center" x="290" y="558" width="620" height="64"/>
  <text class="text label" x="600" y="584" text-anchor="middle">Before PR1: choose the right review artifact</text>
  <text class="text small" x="600" y="608" text-anchor="middle">the format follows the risk</text>

  <rect class="risk" x="100" y="178" width="210" height="92"/>
  <text class="text label" x="205" y="214" text-anchor="middle">Schema Shape</text>
  <text class="text small" x="205" y="244" text-anchor="middle">wrong entity or state home</text>

  <rect class="artifact" x="100" y="440" width="210" height="92"/>
  <text class="text label" x="205" y="476" text-anchor="middle">Schema Proposal</text>
  <text class="text small" x="205" y="506" text-anchor="middle">example reads and writes</text>

  <rect class="risk" x="402" y="178" width="210" height="92"/>
  <text class="text label" x="507" y="214" text-anchor="middle">Ownership</text>
  <text class="text small" x="507" y="244" text-anchor="middle">wrong layer or boundary</text>

  <rect class="artifact" x="402" y="440" width="210" height="92"/>
  <text class="text label" x="507" y="476" text-anchor="middle">Boundary Note</text>
  <text class="text small" x="507" y="506" text-anchor="middle">who owns what</text>

  <rect class="risk" x="704" y="178" width="210" height="92"/>
  <text class="text label" x="809" y="214" text-anchor="middle">UI Fit</text>
  <text class="text small" x="809" y="244" text-anchor="middle">wrong product pattern</text>

  <rect class="artifact" x="704" y="440" width="210" height="92"/>
  <text class="text label" x="809" y="476" text-anchor="middle">Prototype</text>
  <text class="text small" x="809" y="506" text-anchor="middle">screenshots or narrow demo</text>

  <rect class="risk" x="994" y="178" width="110" height="92"/>
  <text class="text label" x="1049" y="214" text-anchor="middle">Integration</text>
  <text class="text small" x="1049" y="244" text-anchor="middle">real edge</text>

  <rect class="artifact" x="994" y="440" width="110" height="92"/>
  <text class="text label" x="1049" y="476" text-anchor="middle">Probe PR</text>
  <text class="text small" x="1049" y="506" text-anchor="middle">touch boundary</text>

  <path class="arrow" d="M 205 270 L 205 430"/>
  <path class="arrow" d="M 507 270 L 507 430"/>
  <path class="arrow" d="M 809 270 L 809 430"/>
  <path class="arrow" d="M 1049 270 L 1049 430"/>

  <text class="text tiny" x="60" y="666">Key idea: the format is negotiable; the function is not.</text>
</svg>
